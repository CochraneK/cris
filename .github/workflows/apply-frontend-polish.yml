name: Apply frontend polish

on:
  push:
    branches:
      - frontend-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_frontend_polish.py
      - name: Validate invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'draft persistence': "cris_quiz_draft_v1" in s and 'sessionStorage' in s,
            'bottom progress': 'foot-progress-bar' in s and "classList.toggle('complete', done===50)" in s,
            'smart scroll': 'maybeAutoScroll' in s,
            'low power confetti': 'LOW_POWER_DEVICE?72:160' in s,
            'two decimals': 'toFixed(1)' not in s,
            'Q1 easter egg': 'autoAnswerAndSubmit' in s and 'num.jump' in s,
            'milestone 17': 'done===17' in s,
            'milestone 33': 'done===33' in s,
            'real points': "API_BASE+'/api/points'" in s,
            'binary gender': "pickGender('male')" in s and "pickGender('female')" in s,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('failed: '+', '.join(bad))
          PY
          git diff --check
      - name: Commit generated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes to commit'
          else
            git commit -m "feat: polish quiz continuity and mobile flow"
            git push origin HEAD:frontend-polish
          fi
