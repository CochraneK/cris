name: Validate CRIS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate scoring, privacy invariants and syntax
        run: |
          node --check cloudbase/crisApi/index.js
          node tests/validate.mjs
